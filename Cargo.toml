[package]
name = "inference-os"
version = "0.1.0"
edition = "2021"
description = "Adaptive model serving gateway and inference control plane"
authors = ["Kaushik Bhargav <kaushik@example.com>"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros", "json", "tokio"] }
tower = { version = "0.4", features = ["util", "timeout", "load-shed"] }
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
parking_lot = "0.12"
tokio-stream = { version = "0.1", features = ["sync"] }
dotenvy = "0.15"
thiserror = "1.0"
bytes = "1.6"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
